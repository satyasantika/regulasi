# Compose produksi Regulasi FKIP Unsil (STANDAR-TEKNIS §7; pola docker-apps seperti keuangan).
# Pakai: cp .env.production.example .env.production && isi; lalu
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Variabel lingkungan (container & interpolasi compose) dari .env.production (TIDAK di-commit). Lihat docs/deploy.md.
#
# Layanan: app (PHP-FPM, migrasi), web (Nginx), queue (Horizon), scheduler (schedule:work), mariadb 10.11
# (pengganti mysql:8.4 paket; ADR 0001), redis 7 (AOF), meilisearch v1.54 (dipin, tanpa port host).

x-aplikasi: &aplikasi
  image: regulasi-app:${APP_VERSION:-latest}
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
    args:
      ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/regulasi}
  env_file: .env.production
  restart: unless-stopped
  volumes:
    # Berkas sementara bersama: unduhan ekstraksi (queue, dihapus di finally) dan ekspor Excel (ditulis queue,
    # diunduh lewat app, dibersihkan ≤ 24 jam oleh scheduler).
    - tmp:/var/www/html/storage/app/tmp
    - logs:/var/www/html/storage/logs
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy
    meilisearch:
      condition: service_started
  networks: [regulasi]

services:
  app:
    <<: *aplikasi
    environment:
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    image: regulasi-web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/regulasi}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8034}:80"
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [regulasi]

  queue:
    <<: *aplikasi
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s

  scheduler:
    <<: *aplikasi
    command: ["php", "artisan", "schedule:work"]

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-regulasi}
      MARIADB_USER: ${DB_USERNAME:-regulasi}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi}
      TZ: Asia/Jakarta
    volumes:
      - mariadb:/var/lib/mysql
      - ./docker/mariadb/regulasi.cnf:/etc/mysql/conf.d/zz-regulasi.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [regulasi]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [regulasi]

  # Indeks pencarian dibangun ulang dari basis data (regulasi:reindeks); volume ini tidak dicadangkan.
  meilisearch:
    image: getmeili/meilisearch:v1.54
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?MEILISEARCH_KEY wajib diisi (min. 16 byte)}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data
    networks: [regulasi]

volumes:
  mariadb:
  redis:
  meilisearch:
  tmp:
  logs:

networks:
  regulasi:
