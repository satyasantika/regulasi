# Compose produksi Regulasi FKIP Unsil (Profil Ringan: STANDAR-TEKNIS §1b dan §7; pola docker-apps seperti surat).
# Pakai: cp .env.production.example .env.production && isi; lalu
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Variabel lingkungan (container & interpolasi compose) dari .env.production (TIDAK di-commit). Lihat docs/DEPLOY.md.
#
# Layanan: app (PHP-FPM, migrasi), web (Nginx), scheduler (schedule:work sekaligus penyala worker antrean), backup
# (klien mariadb-dump ke MariaDB di host). MariaDB berjalan NATIVE di host (DB_HOST=host.docker.internal): compose ini
# TIDAK memuat container database, Redis, Horizon, maupun Meilisearch. Cache, sesi, lock, dan antrean memakai database;
# pencarian memakai FULLTEXT MariaDB + kamus istilah.

# Log Docker dirotasi (STANDAR-TEKNIS §7.1).
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-aplikasi: &aplikasi
  image: regulasi-app:${APP_VERSION:-latest}
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: app
    args:
      ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/regulasi}
  env_file: .env.production
  restart: unless-stopped
  extra_hosts: ["host.docker.internal:host-gateway"]
  logging: *log
  volumes:
    # Berkas sementara bersama: unduhan ekstraksi (worker, dihapus di finally) dan ekspor Excel (ditulis worker,
    # diunduh lewat app, dibersihkan ≤ 24 jam oleh scheduler).
    - tmp:/var/www/html/storage/app/tmp
    - logs:/var/www/html/storage/logs
  networks: [regulasi]

services:
  php:
    <<: *aplikasi
    mem_limit: 512m
    environment:
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  web:
    image: regulasi-web:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        ASSET_URL: ${ASSET_URL:-https://supportfkip.unsil.ac.id/regulasi}
    restart: unless-stopped
    mem_limit: 64m
    logging: *log
    ports:
      - "${WEB_PORT:-8034}:80"
    depends_on:
      - php
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [regulasi]

  # Penjadwal sekaligus pemicu worker antrean (routes/console.php: queue:work tiap menit, --stop-when-empty).
  # Worker berjalan sebagai subproses container ini: batas memori mencakup worker default dan worker berat
  # (--memory=512). Nilai awal PERKIRAAN; wajib dibuktikan dengan `docker stats` (STANDAR-TEKNIS §7.1).
  scheduler:
    <<: *aplikasi
    command: ["php", "artisan", "schedule:work"]
    mem_limit: 768m
    stop_grace_period: 60s

  # Cadangan harian 02:00 WIB ke ./backup/mariadb/<tanggal>/ (retensi RETENSI_HARI, bawaan 30 hari).
  # Hanya KLIEN (mariadb-dump) ke basis data host, bukan server basis data. Simpan salinan di luar disk server.
  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: regulasi-backup:${APP_VERSION:-latest}
    restart: unless-stopped
    mem_limit: 128m
    logging: *log
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-db_regulasi}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME wajib diisi}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
      BACKUP_DIR: /backup/mariadb
      RETENSI_HARI: ${RETENSI_HARI:-30}
      TZ: Asia/Jakarta
    volumes:
      - ./backup:/backup
    networks: [regulasi]

volumes:
  tmp:
  logs:

networks:
  regulasi:
