# Nginx produksi Regulasi FKIP Unsil (container web). Reverse proxy depan supportfkip.unsil.ac.id memotong awalan
# /regulasi dan mengirim X-Forwarded-Prefix /regulasi (lihat docs/deploy.md).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;
    charset utf-8;

    # Tidak ada unggah berkas dokumen (tautan saja); batas untuk impor Excel/CSV.
    client_max_body_size 30M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/vnd.api+json application/xml image/svg+xml;

    # Header dasar dipasang per location statis; respons PHP memasang header lengkap + CSP lewat middleware
    # HeaderKeamanan (add_header di tingkat server akan menggandakan header itu pada respons PHP).

    # Blokir dotfiles (.env, .git, …) kecuali .well-known.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Tidak ada berkas publik di storage (storage:link tidak dipakai).
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    # Aset hasil build bernama-hash: cache panjang.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/(css|js|fonts)/filament/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Panduan pengguna HTML statis (F12.6).
    location ^~ /panduan/ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/index.html =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }
}
