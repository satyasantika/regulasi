# Memastikan Dockerfile produksi valid: membangun image app & web (tanpa push) pada setiap tag rilis v*.
name: Docker regulasi
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Bangun image app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          push: false
          tags: regulasi-app:${{ github.ref_name }}
          build-args: ASSET_URL=https://supportfkip.unsil.ac.id/regulasi

      - name: Bangun image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          push: false
          tags: regulasi-web:${{ github.ref_name }}
          build-args: ASSET_URL=https://supportfkip.unsil.ac.id/regulasi
